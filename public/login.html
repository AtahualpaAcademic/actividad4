<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos - Auth</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #1a73e8; }
        input { display: block; width: 100%; margin: 12px 0; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #555; cursor: pointer; text-decoration: underline; }
        #mensaje { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-form">
            <h2 id="form-title">Iniciar Sesión</h2>
            
            <input type="text" id="nombre" placeholder="Nombre completo" style="display: none;">
            
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            
            <button id="btn-main" onclick="handleSubmit()">Entrar</button>
            
            <p class="toggle-link" id="toggle-text" onclick="toggleForm()">¿No tienes cuenta? Regístrate aquí</p>
            <p id="mensaje"></p>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleForm() {
            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const nombreInput = document.getElementById('nombre');
            const btn = document.getElementById('btn-main');
            const toggleText = document.getElementById('toggle-text');

            if (isLogin) {
                title.innerText = "Iniciar Sesión";
                nombreInput.style.display = "none";
                btn.innerText = "Entrar";
                toggleText.innerText = "¿No tienes cuenta? Regístrate aquí";
            } else {
                title.innerText = "Crear Cuenta";
                nombreInput.style.display = "block";
                btn.innerText = "Registrarme";
                toggleText.innerText = "¿Ya tienes cuenta? Inicia sesión";
            }
        }

        async function handleSubmit() {
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensaje = document.getElementById('mensaje');

            // Elegimos la ruta según el modo (Login o Registro)
            const url = isLogin ? '/api/auth/login' : '/api/auth/register';
            
            // Cuerpo de la petición (el nombre solo se envía en registro)
            const bodyData = isLogin ? { email, password } : { nombre, email, password };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        mensaje.style.color = "green";
                        mensaje.innerText = isLogin ? "¡Login exitoso!" : "¡Registro exitoso! Ya puedes iniciar sesión.";
                        if (!isLogin) toggleForm(); // Cambia a login tras registrarse
                    }
                } else {
                    mensaje.style.color = "red";
                    mensaje.innerText = "Error: " + (data.msg || "Datos incorrectos");
                }
            } catch (error) {
                mensaje.innerText = "Error de conexión con el servidor";
            }
        }
    </script>
</body>
</html>
